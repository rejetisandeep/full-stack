<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Web Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }

    .card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 350px;
      width: 100%;
    }

    input[type="text"] {
      width: 80%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 10px 15px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
      font-size: 14px;
    }

    button:hover {
      background-color: #0056b3;
    }

    #greetingMessage {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #812626;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Dynamic Greeting</h2>
    
    <!-- Input Field -->
    <input type="text" id="username" placeholder="Enter your name">
    <br>
    
    <!-- Action Buttons -->
    <button id="greetBtn">Greet Me</button>
    <button id="toggleBgBtn"> Dark Mode</button>

    <!-- Dynamic Output Element -->
    <p id="greetingMessage"></p>
  </div>

  <script>
    // 1. Select DOM Elements using ID selectors
    const usernameInput = document.getElementById('username');
    const greetBtn = document.getElementById('greetBtn');
    const toggleBgBtn = document.getElementById('toggleBgBtn');
    const greetingMessage = document.getElementById('greetingMessage');

    // 2. Add dynamic functionality via Event Listeners

    // Event 1: Change text dynamically based on input
    greetBtn.addEventListener('click', () => {
      const name = usernameInput.value.trim();
      
      if (name) {
        greetingMessage.textContent = `Hello, ${name}! Welcome to the page. 🎉`;
        greetingMessage.style.color = '#28a745'; // Change text color dynamically
      } else {
        greetingMessage.textContent = 'Please enter a name first!';
        greetingMessage.style.color = '#dc3545';
      }
    });

    // Event 2: Toggle dark mode on the page background
    toggleBgBtn.addEventListener('click', () => {
      const currentBg = document.body.style.backgroundColor;
      
      if (currentBg === 'rgb(34, 34, 34)' || currentBg === '#222222') {
        document.body.style.backgroundColor = '#f4f4f9';
      } else {
        document.body.style.backgroundColor = '#222222';
      }
    });
  </script>

</body>
</html>
