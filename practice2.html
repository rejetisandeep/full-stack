<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple css example</title>
    <style>
        .card {
            width: 300px;
            padding: 20px;
            margin: 20px;
            background-color:#ffffff;
            border: 2px solid #000000;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); 
        }
        .btn {
            color: white;
            padding: 10px 20px;
            border: none;
            background-color:green;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        </style>
<body>
    <div class="card">
        <h2 style="color: #2c3e50; margin-top: 0;">Welcome Box</h2>
        <p style="color: #7f8c8d; line-height: 1.4;">
            This is a very simple container box styled cleanly using foundational properties.
        </p>
        <button class="btn">get started</button>
    </div>
</body>
</html>
